# Canonical compose file — scripts/dev.sh runs `docker compose up -d` against
# it. (scripts/e2e.sh does NOT use compose: it runs its own ephemeral,
# throwaway Postgres on :5433 via `docker run --rm`, so the e2e stack never
# touches this volume.)
# server/docker-compose.yml is a copy for `cd server` convenience — same
# `name:`, so same project. Everything below the header comments must stay identical.
name: devdigest

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdigest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdigest
      POSTGRES_PASSWORD: devdigest
      POSTGRES_DB: devdigest
    ports:
      - "5432:5432"
    volumes:
      - devdigest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdigest -d devdigest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devdigest_pgdata:
    name: devdigest_pgdata
