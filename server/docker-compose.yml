# Duplicate of the repo-root docker-compose.yml, kept so `docker compose up -d`
# also works from server/. Both pin `name: devdigest`, so they address the SAME
# compose project, container and volume — running either is equivalent, and
# neither shadows the other. Keep everything below the header comments identical.
name: devdigest

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devdigest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devdigest
      POSTGRES_PASSWORD: devdigest
      POSTGRES_DB: devdigest
    ports:
      - "5432:5432"
    volumes:
      - devdigest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdigest -d devdigest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devdigest_pgdata:
    name: devdigest_pgdata
